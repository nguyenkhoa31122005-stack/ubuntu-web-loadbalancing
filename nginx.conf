events { }

http {
    upstream backend_servers {
        server phuot-backend-1:80;
        server phuot-backend-2:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
